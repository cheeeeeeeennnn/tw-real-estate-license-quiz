<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>離線中</title>
    <style>
      body {
        margin: 0;
        min-width: 320px;
        background: #f6f7f4;
        color: #17211b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        align-items: center;
        width: min(100%, 720px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 20px 16px;
      }
      section {
        display: grid;
        gap: 12px;
        border: 1px solid #dce3dc;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(36, 49, 42, 0.06);
      }
      h1 {
        margin: 0;
        color: #16251c;
        font-size: 28px;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: #5d6b62;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>目前離線</h1>
        <p>請確認網路連線。若你已登入並開過題庫，重新開啟 App 後可使用已快取的內容。</p>
      </section>
    </main>
  </body>
</html>
